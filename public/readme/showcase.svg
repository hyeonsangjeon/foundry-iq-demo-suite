<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Foundry IQ Demo Suite showcase</title>
  <desc id="desc">A polished overview of the demo suite: agentic retrieval, semantic join, Fabric IQ ontology, SharePoint, MCP server, and guided setup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="42%" stop-color="#0f1d36"/>
      <stop offset="100%" stop-color="#061826"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <style>
      .kicker { font: 700 13px Arial, sans-serif; fill: #67e8f9; letter-spacing: 2.3px; }
      .title { font: 800 42px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #cbd5e1; }
      .card { fill: url(#card); stroke: #334155; stroke-width: 1.2; rx: 20; filter: url(#shadow); }
      .hot { fill: #0c2a40; stroke: #38bdf8; stroke-width: 1.4; rx: 20; filter: url(#shadow); }
      .label { font: 700 18px Arial, sans-serif; fill: #f8fafc; }
      .body { font: 400 13px Arial, sans-serif; fill: #cbd5e1; }
      .metric { font: 800 30px Arial, sans-serif; fill: #f8fafc; }
      .small { font: 700 11px Arial, sans-serif; fill: #67e8f9; letter-spacing: 1.3px; }
      .pill { fill: #082f49; stroke: #0ea5e9; stroke-width: 1; rx: 16; }
      .line { stroke: #38bdf8; stroke-width: 1.8; opacity: 0.7; }
    </style>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="260" fill="#38bdf8" opacity="0.09"/>
  <circle cx="140" cy="450" r="300" fill="#22d3ee" opacity="0.07"/>

  <text x="58" y="72" class="kicker">AZURE AI SEARCH · FOUNDRY IQ · KNOWLEDGE SOURCES</text>
  <text x="58" y="124" class="title">Knowledge Retrieval Studio</text>
  <text x="58" y="158" class="subtitle">A live demo suite for showing how enterprise agents get grounded by Search, Fabric IQ, SharePoint, MCP, and citations.</text>

  <rect x="58" y="205" width="242" height="128" class="hot"/>
  <text x="82" y="246" class="label">Agentic Retrieval</text>
  <text x="82" y="274" class="body">Query planning, hybrid search,</text>
  <text x="82" y="294" class="body">answer synthesis, citations.</text>

  <rect x="328" y="205" width="242" height="128" class="card"/>
  <text x="352" y="246" class="label">Semantic JOIN</text>
  <text x="352" y="274" class="body">Structured metrics plus PDFs</text>
  <text x="352" y="294" class="body">in one grounded response.</text>

  <rect x="598" y="205" width="242" height="128" class="card"/>
  <text x="622" y="246" class="label">Fabric IQ Ontology</text>
  <text x="622" y="274" class="body">Ask live business entities,</text>
  <text x="622" y="294" class="body">not raw tables and columns.</text>

  <rect x="868" y="205" width="242" height="128" class="card"/>
  <text x="892" y="246" class="label">MCP Server KS</text>
  <text x="892" y="274" class="body">Let retrieval call remote</text>
  <text x="892" y="294" class="body">HTTPS tools at query time.</text>

  <line x1="300" y1="269" x2="328" y2="269" class="line"/>
  <line x1="570" y1="269" x2="598" y2="269" class="line"/>
  <line x1="840" y1="269" x2="868" y2="269" class="line"/>

  <rect x="58" y="375" width="188" height="80" class="pill"/>
  <text x="82" y="410" class="metric">6</text>
  <text x="126" y="405" class="small">LIVE DEMO</text>
  <text x="126" y="424" class="small">ROUTES</text>

  <rect x="278" y="375" width="188" height="80" class="pill"/>
  <text x="302" y="410" class="metric">4</text>
  <text x="346" y="405" class="small">BEGINNER</text>
  <text x="346" y="424" class="small">GUIDES</text>

  <rect x="498" y="375" width="188" height="80" class="pill"/>
  <text x="522" y="410" class="metric">1</text>
  <text x="566" y="405" class="small">STANDARD</text>
  <text x="566" y="424" class="small">PYTHON CLI</text>

  <rect x="718" y="375" width="392" height="80" class="pill"/>
  <text x="742" y="410" class="metric">0</text>
  <text x="786" y="405" class="small">LIVE API FLOWS</text>
  <text x="786" y="424" class="small">SCREENSHOTS, GUIDES, AND SMOKE TESTS INCLUDED</text>
</svg>
